<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Night Picker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window">
    <div class="titlebar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="wtitle">Night Picker</span></div>
    <div class="content">
  <h1>🎬 Tonight's Pick</h1>

  <h2>Not sure what to watch?</h2>
  <select id="suggestMood">
    <option value="Funny">😂 Funny</option>
    <option value="Emotional">😢 Emotional</option>
    <option value="Intense">🔥 Intense</option>
    <option value="Scary">😱 Scary</option>
    <option value="Romantic">💙 Romantic</option>
  </select>
  <button id="suggest">Show top movies</button>
  <ol id="suggestions"></ol>

  <hr>

  <h2>My own list</h2>
  <input id="item" placeholder="Add a movie or match">
  <select id="mood">
    <option value="😂">😂 Funny</option>
    <option value="😢">😢 Emotional</option>
    <option value="🔥">🔥 Intense</option>
  </select>
  <button id="add">Add</button>
  <p>Pick from:
    <select id="filter">
      <option value="all">Any mood</option>
      <option value="😂">😂 Funny</option>
      <option value="😢">😢 Emotional</option>
      <option value="🔥">🔥 Intense</option>
    </select>
  </p>
  <ul id="list"></ul>
  <button id="pick">Pick for me!</button>
  <h2 id="result"></h2>

    </div>
  </div>

  <script src="movies.js"></script>
  <script src="recommend.js"></script>
  <script src="app.js"></script>
</body>
</html>
